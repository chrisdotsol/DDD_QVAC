name: Update DDD Snapshots Hourly

on:
  schedule:
    - cron: '0 * * * *'     # Every hour
  workflow_dispatch:        # Manual run button

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch latest DDD data from Solana
        run: node scripts/fetch-ddd.js

      - name: Commit and push changes
        run: |
          git config user.name "usenslabs"
          git config user.email "usenslabs@gmail.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update DDD snapshots $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
